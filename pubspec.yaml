name: story_cutter_free
description: Cut videos into 60-second parts for Instagram Stories.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  file_picker: ^6.1.1
  ffmpeg_kit_flutter_min: ^6.0.3
  video_player: ^2.8.2
  path_provider: ^2.1.1
  path: ^1.8.3
  share_plus: ^7.2.1
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
